; =============================================================================
; platformio.ini — Gree Zone Controller
; Hardware: ESP32-S3 DevKit (38-pin) + 3× MAX485 + SC16IS752 + SDP810-500Pa
; IDE: VS Code + PlatformIO extension
; =============================================================================
;
; BEFORE FIRST BUILD:
;   1. Copy firmware/GreeZoneController/secrets.h.template
;          to firmware/GreeZoneController/secrets.h
;   2. Fill in your WiFi SSID/password and MQTT broker IP in secrets.h
;   3. secrets.h is git-ignored — never commit it
;
; =============================================================================

[platformio]
; Point to the Arduino sketch directory
src_dir  = firmware/GreeZoneController
; Keep build artifacts out of the source tree
build_dir = .pio/build
libdeps_dir = .pio/libdeps

; =============================================================================
; Shared settings inherited by all environments
; =============================================================================
[env]
platform  = espressif32
framework = arduino

; ── Serial monitor ─────────────────────────────────────────────────────────
monitor_speed   = 115200
; Decode stack traces in the monitor output
monitor_filters = esp32_exception_decoder
; Suppress RTS/DTR toggles that can reset the board unexpectedly on USB-CDC
monitor_rts = 0
monitor_dtr = 0

; ── Libraries ──────────────────────────────────────────────────────────────
lib_deps =
    ; MQTT client — used for Home Assistant integration
    knolleary/PubSubClient @ ^2.8
    ; Software UART — needed on fix/protocol-bugs branch (Zone 3 uses SoftwareSerial).
    ; Harmless on feat/zone3-sc16is752 branch (sc16is752.h replaces it, but the
    ; include is still in the .ino on this branch so both envs need the library).
    plerup/EspSoftwareSerial @ ^8.0.1

; ── Upload ─────────────────────────────────────────────────────────────────
; esptool works over both UART and the USB-CDC serial port
upload_speed    = 921600

; =============================================================================
; Primary build environment — ESP32-S3 DevKit (any 38-pin variant)
; =============================================================================
[env:esp32s3]
board = esp32-s3-devkitc-1

; ── USB CDC On Boot (REQUIRED for Zone 2) ──────────────────────────────────
; Moves debug Serial output to the native USB port (D+/D−).
; This frees UART0 hardware for Zone 2 RS485 at full 8E1 parity.
; Equivalent to Arduino IDE: Tools → USB CDC On Boot → Enabled
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; After enabling USB CDC, upload via the USB-C port (not a USB-UART adapter).
; Hold BOOT button while plugging in if the port doesn't appear automatically.
upload_protocol = esptool

; =============================================================================
; SC16IS752 environment — for feat/zone3-sc16is752 branch
; Same board settings; EspSoftwareSerial not needed (sc16is752.h is in-tree)
; =============================================================================
[env:esp32s3-sc16is752]
board = esp32-s3-devkitc-1
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
upload_protocol = esptool
; lib_deps inherited from [env] — both PubSubClient and EspSoftwareSerial included.
; On feat/zone3-sc16is752 branch, sc16is752.h replaces SoftwareSerial at runtime
; but the library must still be present because the .ino includes SoftwareSerial.h
; on the fix/protocol-bugs branch. Switch branches to use this env effectively.
